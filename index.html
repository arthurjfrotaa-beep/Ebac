<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parquímetro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <h1>🅿️ Parquímetro</h1>
      <p>Digite o valor para calcular o tempo de permanência.</p>

      <table>
        <thead><tr><th>Valor</th><th>Tempo</th></tr></thead>
        <tbody>
          <tr><td>R$ 1,00</td><td>30 minutos</td></tr>
          <tr><td>R$ 1,75</td><td>60 minutos</td></tr>
          <tr><td>R$ 3,00 ou mais</td><td>120 minutos (máximo)</td></tr>
        </tbody>
      </table>

      <label for="valor">Valor inserido (R$)</label>
      <input type="number" id="valor" min="0" step="0.01" placeholder="Ex.: 2.50">
      <button id="calcular">Calcular</button>
      <div id="resultado" class="resultado"></div>
    </div>
  </main>
  <script src="scripts.js"></script>
</body>
</html>
